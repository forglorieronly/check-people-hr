<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --ink:#16202B; --ink-soft:#3A4A59; --muted:#6E8091;
  --line:#D8DFE5; --line-soft:#E7ECF0; --paper:#E9EEF1; --card:#FFFFFF;
  --accent:#0E7C8C; --accent-tint:#E1F1F3;
  --ok:#1B7A50; --ok-tint:#E4F2EA;
  --no:#A8382A; --no-tint:#F8E7E4;
  --note:#8A6A17; --note-tint:#FBF1DA;
  --blue:#1F5B96; --blue-tint:#E3EDF7;
  --radius:14px;
  --shadow:0 1px 2px rgba(22,32,43,.05), 0 12px 32px rgba(22,32,43,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.eyebrow{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.shell{max-width:760px;margin:0 auto;padding:24px 20px 80px;transition:max-width .2s}
.shell.wide{max-width:min(1720px, 97vw)}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{height:26px;width:auto;flex:none;display:block}
.brand-rule{width:1px;height:18px;background:var(--line);flex:none}
.brand-sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);
  letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pplcount{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:6px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;
  font-weight:600;color:var(--ink);white-space:nowrap}
.pplcount .n{color:var(--accent)}
.me{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:4px 6px 4px 13px}
.me label{font-size:12px;color:var(--muted);white-space:nowrap}
.me input{width:74px;border:0;outline:0;background:transparent;font-size:12.5px;font-weight:600;
  color:var(--ink);text-transform:uppercase;padding:4px 6px}
.me input::placeholder{color:#A9B6C1;font-weight:400;text-transform:none}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card);flex:none}
.lang button{border:0;background:transparent;padding:6px 13px;font-size:12px;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

.switch{position:relative;display:grid;grid-template-columns:1fr 1fr;background:#DFE6EB;
  border-radius:999px;padding:4px;max-width:340px;margin:0 auto 34px}
.switch-ind{position:absolute;top:4px;left:4px;width:calc(50% - 4px);height:calc(100% - 8px);
  background:var(--card);border-radius:999px;box-shadow:0 1px 3px rgba(22,32,43,.16);
  transition:transform .26s cubic-bezier(.4,.9,.3,1)}
.switch[data-view="table"] .switch-ind{transform:translateX(100%)}
.switch button{position:relative;z-index:1;border:0;background:transparent;padding:9px 10px;
  font-size:13.5px;font-weight:600;color:var(--muted);border-radius:999px;transition:color .2s}
.switch button[aria-selected="true"]{color:var(--ink)}

.btn{border:1px solid var(--line);background:var(--card);color:var(--ink-soft);padding:8px 14px;
  border-radius:9px;font-size:13px;font-weight:600;transition:.15s}
.btn:hover{border-color:var(--ink);color:var(--ink)}
.btn-solid{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-solid:hover{background:#0B1620;color:#fff}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-accent:hover{background:#0A616E;color:#fff}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--ink);border-color:var(--line)}
.btn-danger{color:#B4232C}
.btn-danger:hover{color:#B4232C;border-color:#B4232C}
.btn-sm{padding:6px 11px;font-size:12.5px}

.desk{text-align:center}
.desk h1{font-family:'Onest',sans-serif;font-weight:700;font-size:clamp(28px,5.4vw,40px);
  letter-spacing:-.03em;line-height:1.1;margin:0 0 10px}
.desk p{color:var(--muted);font-size:14px;margin:0 auto;max-width:48ch}
.searchwrap{position:relative;margin:30px auto 0;max-width:560px}
.searchbox{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:7px 7px 7px 18px;box-shadow:var(--shadow);transition:border-color .15s}
.searchbox:focus-within{border-color:var(--accent)}
.searchbox input{flex:1;border:0;outline:0;background:transparent;font-size:17px;padding:12px 0;color:var(--ink);min-width:0}
.searchbox input::placeholder{color:#9BAAB7}
.check-btn{border:0;background:var(--ink);color:#fff;border-radius:10px;padding:13px 22px;
  font-size:14px;font-weight:600;flex:none;transition:.15s}
.check-btn:hover{background:var(--accent)}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:var(--card);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;text-align:left}
.suggest button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:11px 18px;
  font-size:14px;color:var(--ink-soft);border-bottom:1px solid var(--line-soft)}
.suggest button:last-child{border-bottom:0}
.suggest button:hover,.suggest button.active{background:var(--accent-tint);color:var(--ink)}
.select-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px;justify-content:center}
.col-label{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.colchip{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;
  padding:6px 13px;font-size:12.5px;font-weight:500;transition:.15s}
.colchip:hover{border-color:var(--ink);color:var(--ink)}
.colchip[aria-pressed="true"]{background:var(--accent-tint);border-color:var(--accent);color:var(--accent);font-weight:600}
.under-search{margin-top:16px;display:flex;justify-content:center}

.history{margin-top:44px}
.history-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.hlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-soft)}
.hlist li{border-bottom:1px solid var(--line-soft)}
.hlist button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:0;
  background:transparent;padding:12px 4px;font-size:14px;color:var(--ink-soft)}
.hlist button:hover{color:var(--ink)}
.hname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 8px;border-radius:5px;flex:none;font-weight:500}
.chip.ok{background:var(--ok-tint);color:var(--ok)}
.chip.no{background:var(--no-tint);color:var(--no)}
.htime{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);flex:none}

/* ---- table ---- */
.tbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tsearch{flex:1;min-width:220px;border:1px solid var(--line);border-radius:10px;background:var(--card);
  padding:10px 14px;font-size:14px;color:var(--ink);outline:0}
.tsearch:focus{border-color:var(--accent)}
.facet{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 12px;
  font-size:13px;color:var(--ink-soft);outline:0;max-width:200px}
.facet:focus{border-color:var(--accent)}
.tbar-right{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.tmeta{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;margin-bottom:12px}
.tmeta .chips{gap:6px}
.tmeta .colchip{padding:4px 10px;font-size:11.5px}

.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:12px;
  overflow-y:auto;overflow-x:auto;max-height:70vh;box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;font-size:13px}
thead th{position:sticky;top:0;z-index:2;background:#F5F8F9;text-align:left;
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);font-weight:500;padding:0;border-bottom:1px solid var(--line)}
thead th button{width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;font:inherit;
  color:inherit;letter-spacing:inherit;text-transform:inherit;display:flex;gap:5px;align-items:center;line-height:1.3}
thead th button span.lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
thead th button:hover{color:var(--ink)}
.sortmark{color:var(--accent);font-size:8px;flex:none}
tbody td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top;
  color:var(--ink-soft);word-break:break-word;line-height:1.4}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover td{background:#F7FAFB}
td.name{color:var(--ink);font-weight:600}
.rowidx{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#A9B6C1;text-align:right}
.tempty{padding:44px 20px;text-align:center;color:var(--muted);font-size:14px}

.statuspick{width:100%;border:1px solid transparent;border-radius:7px;padding:5px 6px;font-size:11.5px;
  font-weight:600;background:var(--paper);color:var(--ink-soft);outline:0;cursor:pointer}
.statuspick:focus{border-color:var(--accent)}
.st-new{background:#EAEEF1;color:#5A6B7A}
.st-contact{background:var(--blue-tint);color:var(--blue)}
.st-interview{background:var(--note-tint);color:var(--note)}
.st-ok{background:var(--ok-tint);color:var(--ok)}
.st-no{background:var(--no-tint);color:var(--no)}

.notecell{color:var(--note)}
.notecell.blank{color:#B3BFC9}
.notecount{font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--note-tint);
  color:var(--note);border-radius:4px;padding:1px 5px;margin-right:6px}

/* ---- modal ---- */
.backdrop{position:fixed;inset:0;background:rgba(15,23,31,.5);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
.slip{background:var(--card);border-radius:16px;width:100%;max-width:600px;max-height:88vh;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(10,18,26,.3);
  border-left:5px solid var(--muted);animation:rise .22s cubic-bezier(.2,.8,.3,1)}
.slip.ok{border-left-color:var(--ok)}
.slip.no{border-left-color:var(--no)}
.slip.neutral{border-left-color:var(--accent)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.slip-head{padding:24px 26px 20px;border-bottom:1px solid var(--line-soft);position:relative}
.stamp{display:inline-flex;align-items:center;gap:8px;border-radius:7px;padding:6px 12px;
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:14px;animation:stamp .3s cubic-bezier(.2,1.5,.4,1) both}
.stamp.ok{background:var(--ok-tint);color:var(--ok)}
.stamp.no{background:var(--no-tint);color:var(--no)}
.stamp.neutral{background:var(--accent-tint);color:var(--accent)}
@keyframes stamp{from{transform:scale(1.25);opacity:0}to{transform:scale(1);opacity:1}}
.slip-name{font-family:'Onest',sans-serif;font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0;word-break:break-word}
.slip-note{color:var(--muted);font-size:13px;margin:8px 0 0}
.close-x{position:absolute;top:18px;right:18px;border:0;background:transparent;color:var(--muted);
  font-size:22px;line-height:1;padding:4px 8px;border-radius:6px}
.close-x:hover{background:var(--line-soft);color:var(--ink)}
.slip-body{padding:20px 26px;overflow-y:auto}
.slip-foot{padding:16px 26px;border-top:1px solid var(--line-soft);background:#FBFCFD;
  display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

.reccard + .reccard{margin-top:22px;padding-top:20px;border-top:2px solid var(--line-soft)}
.rec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.rec-actions{display:flex;align-items:center;gap:6px}
.rec-tag{margin:0;padding:4px 9px;background:var(--paper);border-radius:6px;display:inline-block}
.statusrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.statusrow label{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
.statusrow select{border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:13.5px;
  font-weight:600;background:var(--card);color:var(--ink);outline:0}
.statusrow select:focus{border-color:var(--accent)}

.fields{margin:0}
.field{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.field:last-child{border-bottom:0}
.field dt{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.field dd{margin:0;font-size:14.5px;color:var(--ink);word-break:break-word;white-space:pre-wrap}
.field dd.empty{color:#A9B6C1;font-style:italic}
.field input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;
  font-size:14px;color:var(--ink);background:var(--card);outline:0}
.field input:focus{border-color:var(--accent)}

.noteblock{margin-top:16px;background:var(--note-tint);border-radius:11px;padding:14px 16px}
.noteblock .nlabel{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--note);margin-bottom:10px}
.notelog{list-style:none;margin:0 0 12px;padding:0}
.notelog li{background:var(--card);border-radius:9px;padding:10px 12px;margin-bottom:8px;position:relative}
.notelog .nmeta{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--note);
  letter-spacing:.06em;margin-bottom:4px;display:flex;gap:8px;align-items:center}
.notelog .ntext{font-size:14px;color:var(--ink);white-space:pre-wrap;word-break:break-word;padding-right:22px}
.notelog .ndel{position:absolute;top:8px;right:8px;border:0;background:transparent;color:#C3B78F;
  font-size:16px;line-height:1;padding:2px 6px;border-radius:5px}
.notelog .ndel:hover{background:var(--no-tint);color:var(--no)}
.noteadd{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.noteadd textarea{flex:1;min-width:200px;min-height:62px;resize:vertical;border:1px solid #E4D5AE;
  border-radius:9px;padding:10px 12px;font-size:14px;line-height:1.5;color:var(--ink);background:var(--card);outline:0}
.noteadd textarea:focus{border-color:var(--note)}
.nohint{font-size:12px;color:var(--note);margin:8px 0 0}

.nearby{background:var(--paper);border-radius:10px;padding:14px 16px}
.nearby p{margin:0 0 10px;font-size:13px;color:var(--ink-soft)}
.nearby button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;
  font-size:13.5px;font-weight:600;color:var(--ink)}
.nearby button:hover{border-color:var(--accent);color:var(--accent)}

.form-grid{display:grid;gap:14px}
.f label{display:block;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.f input,.f textarea,.f select{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 13px;
  font-size:14.5px;color:var(--ink);background:var(--card);outline:0;transition:border-color .15s}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--accent)}
.f .req{color:var(--no)}
.form-error{color:var(--no);font-size:13px;margin:0 0 4px;font-weight:500}

.filepanel{border:1.5px dashed var(--line);border-radius:var(--radius);background:rgba(255,255,255,.6);
  padding:24px 22px;text-align:center;margin-bottom:14px}
.filepanel.over{border-color:var(--accent);background:var(--accent-tint)}
.filepanel h2{font-family:'Onest',sans-serif;font-size:15px;font-weight:600;margin:0 0 6px}
.filepanel p{color:var(--muted);font-size:13px;margin:0 0 16px;max-width:54ch;margin-inline:auto}
.fp-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.fp-meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-top:14px}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:500;z-index:90;
  box-shadow:0 10px 30px rgba(0,0,0,.25);animation:rise .2s ease both;max-width:90vw;text-align:center}

[hidden]{display:none !important}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
@media (max-width:760px){
  .logo{height:22px}
  .brand-rule{display:none}
  .brand-sub{display:none}
  .searchbox{flex-wrap:wrap;padding:14px}
  .searchbox input{width:100%;padding:4px 0 12px}
  .check-btn{width:100%}
  .slip-foot{justify-content:stretch}
  .slip-foot .btn{flex:1}
  .tbar-right{margin-left:0;width:100%}
  table{table-layout:auto;font-size:12.5px}
}
</style>
</head>

/* ================= BG/EN name transliteration (best-effort, not a perfect round-trip) ================= */
var BG2EN={
  "а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ж":"zh","з":"z","и":"i","й":"y",
  "к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u",
  "ф":"f","х":"h","ц":"ts","ч":"ch","ш":"sh","щ":"sht","ъ":"a","ь":"y","ю":"yu","я":"ya"
};
var EN2BG_CHUNKS=[
  ["sht","щ"],["zh","ж"],["ts","ц"],["ch","ч"],["sh","ш"],["yu","ю"],["ya","я"],
  ["a","а"],["b","б"],["v","в"],["g","г"],["d","д"],["e","е"],["z","з"],["i","и"],
  ["y","й"],["k","к"],["l","л"],["m","м"],["n","н"],["o","о"],["p","п"],["r","р"],
  ["s","с"],["t","т"],["u","у"],["f","ф"],["h","х"]
];
function translitBgToEn(str){
  return String(str||"").split("").map(function(ch){
    var low=ch.toLowerCase();
    var mapped=BG2EN[low];
    if(!mapped) return ch;
    if(ch!==low) mapped=mapped.charAt(0).toUpperCase()+mapped.slice(1);
    return mapped;
  }).join("");
}
function translitEnToBg(str){
  var s=String(str||""); var out=""; var i=0;
  while(i<s.length){
    var low=s.slice(i).toLowerCase();
    var matched=false;
    for(var j=0;j<EN2BG_CHUNKS.length;j++){
      var chunk=EN2BG_CHUNKS[j][0];
      if(low.indexOf(chunk)===0){
        var bg=EN2BG_CHUNKS[j][1];
        if(s.charAt(i)!==s.charAt(i).toLowerCase()) bg=bg.charAt(0).toUpperCase()+bg.slice(1);
        out+=bg; i+=chunk.length; matched=true; break;
      }
    }
    if(!matched){ out+=s.charAt(i); i++; }
  }
  return out;
}

var CYR={"а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ж":"zh","з":"z","и":"i","й":"i",
"к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f",
"х":"h","ц":"ts","ч":"ch","ш":"sh","щ":"sht","ъ":"a","ь":"","ю":"yu","я":"ya",
"ы":"i","э":"e","ё":"e","і":"i","ї":"i","є":"e"};
function translit(s){ var o=""; for(var i=0;i<s.length;i++){ var c=s[i]; o+=(CYR[c]!==undefined)?CYR[c]:c; } return o; }
function norm(s){
  s=(s||"").toString().toLowerCase().trim();
  s=s.normalize?s.normalize("NFD").replace(/[\u0300-\u036f]/g,""):s;
  s=translit(s);
  return s.replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
}
function sortKey(s){ return norm(s).split(" ").filter(Boolean).sort().join(" "); }
function lev(a,b){
  if(a===b) return 0;
  var m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  var prev=new Array(n+1),cur=new Array(n+1),i,j;
  for(j=0;j<=n;j++) prev[j]=j;
  for(i=1;i<=m;i++){
    cur[0]=i;
    for(j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    for(j=0;j<=n;j++) prev[j]=cur[j];
  }
  return prev[n];
}

/* ================= CSV ================= */
function sniffDelimiter(text){
  var line="",inQ=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(c==='"') inQ=!inQ;
    if(!inQ&&c==="\n") break;
    line+=c;
  }
  var counts={",":0,";":0,"\t":0,"|":0},q=false;
  for(var k=0;k<line.length;k++){
    var ch=line[k];
    if(ch==='"') q=!q; else if(!q&&counts[ch]!==undefined) counts[ch]++;
  }
  var best=",",bv=-1;
  Object.keys(counts).forEach(function(d){ if(counts[d]>bv){bv=counts[d];best=d;} });
  return bv>0?best:",";
}
function parseCSV(text,delim){
  text=text.replace(/^\uFEFF/,"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  var rows=[],row=[],cell="",inQ=false,i=0;
  while(i<text.length){
    var c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i+=2; continue; } inQ=false; i++; continue; }
      cell+=c; i++; continue;
    }
    if(c==='"'){ inQ=true; i++; continue; }
    if(c===delim){ row.push(cell); cell=""; i++; continue; }
    if(c==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; i++; continue; }
    cell+=c; i++;
  }
  row.push(cell); rows.push(row);
  return rows.filter(function(r){ return r.some(function(v){ return v.trim()!==""; }); });
}
function toCSV(headers,records,delim){
  function esc(v){
    v=(v==null?"":String(v));
    if(v.indexOf(delim)>-1||v.indexOf('"')>-1||v.indexOf("\n")>-1) return '"'+v.replace(/"/g,'""')+'"';
    return v;
  }
  var lines=[headers.map(esc).join(delim)];
  records.forEach(function(r){ lines.push(headers.map(function(h){ return esc(r[h]); }).join(delim)); });
  return "\uFEFF"+lines.join("\r\n");
}

/* ================= state ================= */
var S={ headers:[], records:[], nameCols:[], notesCol:"", statusCol:"", sourceCol:"", channelCol:"", hidden:{},
        delim:",", fileName:"", history:[], sort:{col:"",dir:1}, filter:"", facetVals:{}, me:"" };

var NAME_HINTS=["име","имена","name","person","служител","employee","шофьор","driver","лице"];
var NOT_NAME=["имейл","мейл","email","e-mail","mail","телефон","phone"];
var NOTE_HINTS=["бележ","коментар","note","comment","remark"];
var STATUS_HINTS=["статус","status","етап","stage"];
var SOURCE_HINTS=["източник","source"];
var CHANNEL_HINTS=["канал","channel"];

function guessNameCols(headers){
  var hits=headers.filter(function(h){
    var l=h.toLowerCase().trim();
    if(NOT_NAME.some(function(n){ return l.indexOf(n)>-1; })) return false;
    return NAME_HINTS.some(function(n){ return l.indexOf(n)>-1; });
  });
  return hits.length?hits:[headers[0]];
}
function findCol(headers,hints){
  for(var i=0;i<headers.length;i++){
    var l=headers[i].toLowerCase();
    if(hints.some(function(n){ return l.indexOf(n)>-1; })) return headers[i];
  }
  return "";
}

function loadRows(rows,fileName,delim){
  if(!rows.length||!rows[0].length){ toast(t("noCols")); return; }
  var headers=rows[0].map(function(h,i){ return h.trim()||("Column "+(i+1)); });
  var seen={};
  headers=headers.map(function(h){ if(seen[h]){ seen[h]++; return h+" ("+seen[h]+")"; } seen[h]=1; return h; });

  var records=rows.slice(1).map(function(r){
    var o={}; headers.forEach(function(h,i){ o[h]=(r[i]||"").trim(); }); return o;
  });

  S.statusCol=findCol(headers,STATUS_HINTS);
  if(!S.statusCol){
    S.statusCol="Статус";
    headers.push(S.statusCol);
    records.forEach(function(r){ r[S.statusCol]=STATUSES[0].v; });
  } else {
    records.forEach(function(r){ if(!r[S.statusCol]) r[S.statusCol]=STATUSES[0].v; });
  }
  S.notesCol=findCol(headers,NOTE_HINTS);
  if(!S.notesCol){
    S.notesCol="Бележки";
    headers.push(S.notesCol);
    records.forEach(function(r){ r[S.notesCol]=""; });
  }
  S.sourceCol=findCol(headers,SOURCE_HINTS);
  S.channelCol=findCol(headers,CHANNEL_HINTS);

  S.headers=headers; S.records=records; S.delim=delim||",";
  S.fileName=fileName; S.nameCols=guessNameCols(headers);
  S.history=[]; S.sort={col:"",dir:1}; S.filter=""; S.facetVals={}; S.hidden={};

  $("tq").value="";
  $("fpMeta").textContent=t("loadedFile")+fileName;
  $("filepanel").hidden=true;
  renderColChips(); renderVisChips(); renderFacets(); renderTable(); renderHistory();
}

/* ================= record helpers ================= */
function primaryCol(){ return S.nameCols[0]||S.headers[0]; }
function nameOf(r){
  for(var i=0;i<S.nameCols.length;i++){ var v=(r[S.nameCols[i]]||"").trim(); if(v) return v; }
  return "";
}
function namesOf(r){ return S.nameCols.map(function(h){ return (r[h]||"").trim(); }).filter(Boolean); }

/* notes are an append-only log: "[30.07.2026 · ВД] текст" per line */
function parseNotes(rec){
  var raw=(rec[S.notesCol]||"").trim();
  if(!raw) return [];
  return raw.split("\n").filter(function(l){ return l.trim(); }).map(function(line){
    var m=line.match(/^\[([^\]·]+?)\s*·\s*([^\]]*?)\]\s*([\s\S]*)$/);
    if(m) return {date:m[1].trim(), who:m[2].trim(), text:m[3].trim(), raw:line};
    return {date:"", who:"", text:line.trim(), raw:line};
  });
}
function writeNotes(rec,list){
  rec[S.notesCol]=list.map(function(n){
    return n.date||n.who ? "["+n.date+" · "+n.who+"] "+n.text : n.text;
  }).join("\n");
}
function stamp(){
  var d=new Date();
  return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear();
}
function addNote(rec,text){
  var list=parseNotes(rec);
  list.push({date:stamp(), who:S.me||"—", text:text.replace(/\n+/g," ").trim()});
  writeNotes(rec,list);
}

/* ================= matching ================= */
function findAll(query){
  var raw=(query||"").trim().toLowerCase();
  var nq=norm(query), sq=sortKey(query);
  if(!nq&&!raw) return [];
  if(raw.indexOf("@")>-1){
    return S.records.filter(function(r){
      return S.headers.some(function(h){ return (r[h]||"").trim().toLowerCase()===raw; });
    });
  }
  var exact=S.records.filter(function(r){ return namesOf(r).some(function(n){ return norm(n)===nq; }); });
  if(exact.length) return exact;
  if(!sq) return [];
  return S.records.filter(function(r){ return namesOf(r).some(function(n){ return sortKey(n)===sq; }); });
}
function findExact(q){ var m=findAll(q); return m.length?m[0]:null; }
function findNearest(query){
  var nq=norm(query); if(!nq) return null;
  var best=null,bd=99,label="";
  S.records.forEach(function(r){
    namesOf(r).forEach(function(n){
      var d=lev(nq,norm(n));
      if(d<bd){ bd=d; best=r; label=n; }
    });
  });
  var tol=nq.length<=6?2:(nq.length<=12?3:4);
  return bd<=tol?{rec:best,label:label}:null;
}
function suggestions(query){
  var nq=norm(query); if(nq.length<2) return [];
  var starts=[],has=[],seen={};
  S.records.forEach(function(r){
    namesOf(r).forEach(function(raw){
      var n=norm(raw);
      if(!n||seen[n]) return;
      if(n.indexOf(nq)===0){ seen[n]=1; starts.push(raw); }
      else if(n.indexOf(nq)>-1){ seen[n]=1; has.push(raw); }
    });
  });
  return starts.concat(has).slice(0,6);
}

/* ================= facets ================= */
function facetCols(){
  var out=[];
  if(S.statusCol) out.push(S.statusCol);
  S.headers.forEach(function(h){
    if(out.length>=3) return;
    if(h===S.notesCol||h===S.statusCol||S.nameCols.indexOf(h)>-1) return;
    if(NOT_NAME.some(function(n){ return h.toLowerCase().indexOf(n)>-1; })) return;
    var vals={},n=0,ok=true;
    for(var i=0;i<S.records.length;i++){
      var v=(S.records[i][h]||"").trim();
      if(!vals[v]){ vals[v]=1; n++; if(n>8){ ok=false; break; } }
    }
    if(ok&&n>=2) out.push(h);
  });
  return out.slice(0,3);
}
function renderFacets(){
  var box=$("facets"); if(!box) return;
  box.innerHTML="";
  facetCols().forEach(function(h){
    var vals=[];
    if(h===S.statusCol){
      vals=STATUSES.map(function(s){ return s.v; });
    } else {
      S.records.forEach(function(r){
        var v=(r[h]||"").trim();
        if(v&&vals.indexOf(v)===-1) vals.push(v);
      });
      vals.sort(function(a,b){ return a.localeCompare(b,"bg"); });
    }
    var sel=document.createElement("select");
    sel.className="facet";
    var o0=document.createElement("option");
    o0.value=""; o0.textContent=(h===S.statusCol?t("statusLabel"):h)+": "+t("all");
    sel.appendChild(o0);
    vals.forEach(function(v){
      var o=document.createElement("option");
      o.value=v; o.textContent=(h===S.statusCol)?statusLabel(v):v;
      if(S.facetVals[h]===v) o.selected=true;
      sel.appendChild(o);
    });
    sel.addEventListener("change",function(){
      if(sel.value) S.facetVals[h]=sel.value; else delete S.facetVals[h];
      renderTable();
    });
    box.appendChild(sel);
  });
}

/* ================= table ================= */
function visibleRecords(){
  var f=norm(S.filter), fRaw=S.filter.toLowerCase().trim();
  return S.records.filter(function(r){
    var ok=true;
    Object.keys(S.facetVals).forEach(function(h){
      if((r[h]||"").trim()!==S.facetVals[h]) ok=false;
    });
    if(!ok) return false;
    if(!fRaw) return true;
    return S.headers.some(function(h){
      var v=(r[h]||"");
      return norm(v).indexOf(f)>-1 || v.toLowerCase().indexOf(fRaw)>-1;
    });
  });
}

function colWidth(h){
  if(h===S.notesCol) return "26%";
  if(h===S.statusCol) return "9%";
  if(S.nameCols.indexOf(h)>-1) return "12%";
  if(NOT_NAME.some(function(n){ return h.toLowerCase().indexOf(n)>-1; })) return "15%";
  return "auto";
}

    rows=rows.slice().sort(function(a,b){

function showAddForm(prefill){
  var dupeAck=false;
  $("slip").className="slip neutral";
  $("stamp").style.display="none";
  $("slipName").textContent=t("addTitle");
  $("slipNote").textContent=t("addNote");

  var body=$("slipBody"); body.innerHTML="";
  var err=document.createElement("p"); err.className="form-error"; err.hidden=true;
  body.appendChild(err);

  var grid=document.createElement("div"); grid.className="form-grid";
  var inputs={};
  S.headers.forEach(function(h){
    if(h===S.sourceCol) return;
    var wrap=document.createElement("div"); wrap.className="f";
    var lab=document.createElement("label");
    lab.textContent = h===S.statusCol ? t("statusLabel") : (h===S.notesCol ? t("notes") : h);
    if(h===primaryCol()){
      var r=document.createElement("span"); r.className="req"; r.textContent=" · "+t("required");
      lab.appendChild(r);
    }
    var inp;
    if(h===S.statusCol){
      inp=document.createElement("select");
      STATUSES.forEach(function(s){
        var o=document.createElement("option");
        o.value=s.v; o.textContent=lang==="bg"?s.v:s.en;
        inp.appendChild(o);
      });
    } else if(h===S.channelCol){
      inp=document.createElement("select");
      CHANNELS.forEach(function(c){
        var o=document.createElement("option");
        o.value=c.v; o.textContent=lang==="bg"?c.v:c.en;
        inp.appendChild(o);
      });
    } else if(h===S.notesCol){
      inp=document.createElement("textarea");
      inp.placeholder=t("notePh");
    } else {
      inp=document.createElement("input"); inp.type="text";
      inp.value=(h===primaryCol()&&prefill)?prefill:"";
    }
    inputs[h]=inp;
    wrap.appendChild(lab); wrap.appendChild(inp);
    grid.appendChild(wrap);
  });
  body.appendChild(grid);

  var bgCol=primaryCol(), enCol=S.nameCols[1];
  if(bgCol && enCol && inputs[bgCol] && inputs[enCol]){
    var autoFilled={bg:false,en:false};
    inputs[bgCol].addEventListener("input",function(){
      autoFilled.bg=false;
      if(!inputs[enCol].value.trim()||autoFilled.en){
        inputs[enCol].value=translitBgToEn(inputs[bgCol].value);
        autoFilled.en=true;
      }
    });
    inputs[enCol].addEventListener("input",function(){
      autoFilled.en=false;
      if(!inputs[bgCol].value.trim()||autoFilled.bg){
        inputs[bgCol].value=translitEnToBg(inputs[enCol].value);
        autoFilled.bg=true;
      }
    });
  }

  var foot=$("slipFoot"); foot.innerHTML="";
  foot.appendChild(mkBtn(t("cancel"),"btn",closeModal));
  foot.appendChild(mkBtn(t("save"),"btn btn-accent",function(){
    var name=inputs[primaryCol()].value.trim();
    if(!name){ err.textContent=t("fillName"); err.hidden=false; inputs[primaryCol()].focus(); return; }
    if(findExact(name)&&!dupeAck){
      dupeAck=true; err.textContent=t("dupe"); err.hidden=false;
      inputs[primaryCol()].focus(); return;
    }
    var rec={};
    S.headers.forEach(function(h){
      if(h===S.notesCol){ rec[h]=""; return; }
      rec[h]=inputs[h]?inputs[h].value.trim():"";
    });
    var firstNote=inputs[S.notesCol].value.trim();
    if(firstNote) addNote(rec,firstNote);
    S.records.push(rec);
    closeModal();
    $("q").value="";
    pushHistory(name,true);
    renderFacets(); renderTable();
    toast(t("added"));
  }));

  openModal();
  var first=inputs[primaryCol()];
  if(first){ first.focus(); if(first.select) first.select(); }
}

/* ================= history ================= */
function pushHistory(name,ok){
  var d=new Date();
  S.history.unshift({name:name,ok:ok,
    time:String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")});
  S.history=S.history.slice(0,8);
  renderHistory();
}
function renderHistory(){
  var ul=$("hlist"); if(!ul) return;
  ul.innerHTML="";
  $("history").hidden=S.history.length===0;
  S.history.forEach(function(h){
    var li=document.createElement("li");
    var b=document.createElement("button"); b.type="button";
    var n=document.createElement("span"); n.className="hname"; n.textContent=h.name;
    var c=document.createElement("span"); c.className="chip "+(h.ok?"ok":"no");
    c.textContent=h.ok?t("approved"):t("notfound");
    var tm=document.createElement("span"); tm.className="htime"; tm.textContent=h.time;
    b.appendChild(n); b.appendChild(c); b.appendChild(tm);
    b.addEventListener("click",function(){ $("q").value=h.name; runCheck(); });
    li.appendChild(b); ul.appendChild(li);
  });
}

/* ================= toast ================= */
var toastTimer=null;
function toast(msg){
  var el=$("toast");
  el.textContent=msg; el.hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ el.hidden=true; },3800);
}

/* ================= actions ================= */
function runCheck(){
  var q=$("q").value.trim();
  hideSuggest();
  if(!q){ $("q").focus(); return; }
  var m=findAll(q);
  if(m.length){ pushHistory(nameOf(m[0]),true); showApproved(m); }
  else { pushHistory(q,false); showNotFound(q); }
}
function readFile(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var text=fr.result, d=sniffDelimiter(text);
      loadRows(parseCSV(text,d), file.name, d);
      setView("table");
    }catch(e){ toast(t("bad")); }
  };
  fr.onerror=function(){ toast(t("bad")); };
  fr.readAsText(file,"UTF-8");
}
function download(){
  var csv=toCSV(S.headers,S.records,S.delim);
  var blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;
  a.download=(S.fileName||"register.csv").replace(/\.csv$/i,"")+"-updated.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); },1000);
  toast(t("downloaded"));
}

/* ================= suggest ================= */
var sugIdx=-1;
function showSuggest(){
  var list=suggestions($("q").value), box=$("suggest");
  box.innerHTML=""; sugIdx=-1;
  if(!list.length){ box.hidden=true; return; }
  list.forEach(function(label){
    var b=document.createElement("button");
    b.type="button"; b.textContent=label;
    b.addEventListener("mousedown",function(e){
      e.preventDefault(); $("q").value=label; hideSuggest(); runCheck();
    });
    box.appendChild(b);
  });
  box.hidden=false;
}
function hideSuggest(){ $("suggest").hidden=true; sugIdx=-1; }
function moveSuggest(dir){
  var box=$("suggest");
  if(box.hidden) return false;
  var items=box.querySelectorAll("button");
  if(!items.length) return false;
  sugIdx+=dir;
  if(sugIdx<0) sugIdx=items.length-1;
  if(sugIdx>=items.length) sugIdx=0;
  items.forEach(function(b,i){ b.classList.toggle("active",i===sugIdx); });
  $("q").value=items[sugIdx].textContent;
  return true;
}

/* ================= views ================= */
var reminderShown=false;
function setView(v){
  $("switch").setAttribute("data-view",v);
  $("switch").querySelectorAll("button").forEach(function(b){
    b.setAttribute("aria-selected", b.getAttribute("data-view")===v);
  });
  $("viewCheck").hidden = v!=="check";
  $("viewTable").hidden = v!=="table";
  $("shell").classList.toggle("wide", v==="table");
  if(v==="table"){
    renderTable();
    if(!reminderShown){ reminderShown=true; toast(t("reminder")); }
    setTimeout(function(){ $("tq").focus(); },40);
  } else {
    setTimeout(function(){ $("q").focus(); },40);
  }
}
